# Blueprint do Render: caminho quente ao vivo (API .NET + painel React).
#
# O caminho frio (ClickHouse + ETL) nao sobe aqui. Sem ele, os endpoints
# historicos respondem 503 e o painel mostra o aviso de indisponibilidade
# que ja existe (UnavailableModal). O tempo real nao depende dele (RN-14).
#
# Variaveis com `sync: false` sao preenchidas no painel do Render na
# primeira criacao do Blueprint e nunca ficam no repositorio.
services:
  - type: web
    name: alphractal-fees-api
    runtime: docker
    plan: free
    rootDir: api
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      # O Dockerfile escuta em 8080 (ASPNETCORE_URLS).
      - key: PORT
        value: "8080"
      # Alchemy: wss://eth-mainnet.g.alchemy.com/v2/<chave>
      - key: Fees__RpcWebSocketUrl
        sync: false
      # Alchemy: https://eth-mainnet.g.alchemy.com/v2/<chave>
      - key: Fees__RpcHttpUrl
        sync: false
      # O container roda como usuario nao-root; o caminho padrao do spool
      # (/spool) nao e gravavel. Sem ETL consumindo, o spool so precisa existir.
      - key: Fees__SpoolPath
        value: /tmp/spool
      # URL publica do painel, ex.: https://alphractal-fees-web.onrender.com
      - key: Cors__Origins__0
        sync: false

  - type: web
    name: alphractal-fees-web
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      # SPA com react-router: qualquer rota cai no index.html.
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # URL publica da API, ex.: https://alphractal-fees-api.onrender.com
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_USE_MOCK
        value: "false"
      # Sem caminho frio, abre na tela que depende so do caminho quente.
      - key: VITE_HOME_ROUTE
        value: /real-time-gas
