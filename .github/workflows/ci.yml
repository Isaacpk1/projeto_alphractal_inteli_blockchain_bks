name: CI

# Quatro pastas, quatro donos, tres linguagens com warnings tratados como erro.
# O CI existe para que quebrar a area do outro apareca no PR, nao no merge.
on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]

# Um PR novo cancela a execucao anterior do mesmo branch: nao adianta gastar
# runner terminando um build que ja esta desatualizado.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: api · .NET 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restaurar
        working-directory: api
        run: dotnet restore

      # Sem --no-restore aqui de proposito: a falha de restore por NU1903
      # (vulnerabilidade conhecida em dependencia) precisa reprovar o CI, e ela
      # so aparece na restauracao.
      - name: Compilar
        working-directory: api
        run: dotnet build --no-restore --configuration Release

      - name: Testar
        working-directory: api
        run: dotnet test --no-build --configuration Release --verbosity normal

  etl:
    name: etl · Python 3.12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar
        working-directory: etl
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Testar
        working-directory: etl
        run: python -m pytest -q

      # Gate de tipagem da RNF-13. mypy em modo strict.
      - name: Tipagem
        working-directory: etl
        run: python -m mypy src

  web:
    name: web · TypeScript strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # O lockfile torna a instalação reproduzível no runner.
      - name: Instalar
        working-directory: web
        run: npm ci

      - name: Tipagem
        working-directory: web
        run: npm run typecheck

      - name: Build
        working-directory: web
        run: npm run build

  contrato:
    name: contrato api ↔ web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Nenhum compilador verifica se Models/Responses/ e contract.ts batem — e
      # a fragilidade que a ADR-001 documenta. Este passo nao valida os tipos
      # (isso exigiria geracao de codigo), mas obriga o autor a encarar a
      # pergunta: mudou um lado sem o outro?
      - name: Alertar mudanca de um lado so
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          if [ -z "$base" ]; then
            echo "não é PR; nada a comparar"
            exit 0
          fi
          alterados=$(git diff --name-only "$base" "$head")
          echo "$alterados" | grep -q 'Models/Responses/' && tocou_api=1 || tocou_api=0
          echo "$alterados" | grep -q 'web/src/types/contract.ts' && tocou_web=1 || tocou_web=0
          if [ "$tocou_api" -ne "$tocou_web" ]; then
            echo "::warning::Models/Responses/ e web/src/types/contract.ts sao os dois lados do mesmo contrato e mudaram separadamente. Confirme se o outro lado precisa mudar no MESMO PR."
          else
            echo "contrato consistente (ambos ou nenhum)"
          fi
